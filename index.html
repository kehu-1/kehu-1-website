<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你的公司名 - 专业B2B供应商</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; color: #333; line-height: 1.6; }
    header { background: #1a1a2e; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.4rem; }
    nav a { color: #ccc; margin-left: 1.5rem; text-decoration: none; font-size: 0.95rem; }
    nav a:hover { color: #fff; }
    .hero { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; padding: 5rem 2rem; text-align: center; }
    .hero h2 { font-size: 2rem; margin-bottom: 1rem; }
    .hero p { color: #aaa; max-width: 600px; margin: 0 auto; }
    section { padding: 4rem 2rem; max-width: 1100px; margin: 0 auto; }
    section h3 { font-size: 1.5rem; margin-bottom: 2rem; border-left: 4px solid #e94560; padding-left: 1rem; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
    .product-card { border: 1px solid #eee; border-radius: 8px; padding: 1.5rem; transition: box-shadow 0.2s; }
    .product-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .product-card h4 { margin-bottom: 0.5rem; color: #1a1a2e; }
    .product-card p { color: #666; font-size: 0.9rem; }
    .news-list { list-style: none; }
    .news-list li { padding: 1rem 0; border-bottom: 1px solid #eee; }
    .news-list li:last-child { border-bottom: none; }
    .news-list .date { color: #999; font-size: 0.85rem; }
    .news-list a { color: #1a1a2e; text-decoration: none; font-weight: 500; }
    .news-list a:hover { color: #e94560; }
    .contact-form { max-width: 500px; }
    .contact-form input, .contact-form textarea { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; }
    .contact-form textarea { height: 120px; resize: vertical; }
    .contact-form button { background: #e94560; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .contact-form button:hover { background: #c73550; }
    footer { background: #1a1a2e; color: #888; text-align: center; padding: 2rem; font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <h1>你的公司名</h1>
  <nav>
    <a href="#products">产品</a>
    <a href="#news">新闻</a>
    <a href="#contact">联系我们</a>
  </nav>
</header>

<div class="hero">
  <h2>专业B2B供应商</h2>
  <p>我们为全球客户提供优质产品与服务，欢迎垂询合作。</p>
</div>

<section id="products">
  <h3>产品展示</h3>
  <div class="products">
    <div class="product-card">
      <h4>产品 A</h4>
      <p>产品A的简短描述，突出核心卖点和优势。</p>
    </div>
    <div class="product-card">
      <h4>产品 B</h4>
      <p>产品B的简短描述，突出核心卖点和优势。</p>
    </div>
    <div class="product-card">
      <h4>产品 C</h4>
      <p>产品C的简短描述，突出核心卖点和优势。</p>
    </div>
  </div>
</section>

<section id="news">
  <h3>新闻动态</h3>
  <ul class="news-list" id="news-list">
    <li><span class="date">2026-09-16</span> <a href="#">公司参加2026年秋季广交会</a></li>
    <li><span class="date">2026-09-01</span> <a href="#">新产品线正式投产</a></li>
  </ul>
</section>

<section id="contact">
  <h3>联系我们</h3>
  <form class="contact-form" action="https://formspree.io/f/你的表单ID" method="POST">
    <input type="text" name="name" placeholder="您的姓名" required>
    <input type="email" name="email" placeholder="您的邮箱" required>
    <textarea name="message" placeholder="请描述您的需求" required></textarea>
    <button type="submit">提交</button>
  </form>
</section>

<footer>
  <p>&copy; 2026 你的公司名. All rights reserved.</p>
</footer>

</body>
</html>
