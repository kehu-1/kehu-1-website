<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部门介绍 - 你的品牌名</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap');
    :root { --tech-green: #00FFB9; --dark-bg: #0F172A; --text-main: #111827; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; color: var(--text-main); line-height: 1.8; background: #fff; }
    a { text-decoration: none; transition: 0.3s; color: inherit; }

    /* --- 页面主体样式（保持不变） --- */
    header { background: var(--dark-bg); position: sticky; top: 0; z-index: 1000; }
    .header-inner { max-width: 1240px; margin: 0 auto; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: 2px; }
    .back-btn { color: var(--tech-green); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; }

    .page-container { max-width: 1240px; margin: 0 auto; padding: 4rem 2rem; }
    .page-title { font-size: 3.5rem; font-weight: 800; margin-bottom: 3rem; color: var(--text-main); letter-spacing: -1px; line-height: 1.2; }

    .layout-intro { display: flex; gap: 5rem; align-items: flex-start; margin-bottom: 4rem; }
    .layout-intro .intro-text { flex: 1; font-size: 1.05rem; color: #374151; }
    .layout-intro .intro-text p { margin-bottom: 1.5rem; text-align: justify; line-height: 2; }
    .layout-intro .intro-logo { flex: 0.6; display: flex; justify-content: flex-end; }
    .layout-intro .intro-logo img { max-width: 100%; max-height: 180px; object-fit: contain; }

    .two-col-lists { display: flex; gap: 6rem; margin-bottom: 5rem; }
    .two-col-lists .list-group { flex: 1; }
    .two-col-lists h3 { font-size: 1.6rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-main); }
    .two-col-lists ul { list-style-type: disc; padding-left: 1.5rem; color: #111827; font-weight: 500; }
    .two-col-lists li { margin-bottom: 0.8rem; font-size: 1.05rem; }
    .two-col-lists p { color: #111827; font-size: 1.05rem; line-height: 2; }

    .grid-section h2 { font-size: 2.2rem; font-weight: 700; margin-bottom: 2.5rem; color: var(--text-main); }
    .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem 2rem; }
    .grid-card { display: flex; flex-direction: column; }
    .grid-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; margin-bottom: 1.5rem; border-radius: 4px; background: #f3f4f6; }
    .grid-card h4 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.4; }
    .grid-card p { font-size: 1rem; color: #374151; line-height: 1.7; margin-bottom: 1.5rem; flex-grow: 1; }
    .grid-card .link { color: #0ea5e9; font-weight: 700; font-size: 1rem; display: inline-block; cursor: pointer; }
    .grid-card .link:hover { text-decoration: underline; }

    /* --- 弹窗与轮播样式 --- */
    .card-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); z-index: 3000; justify-content: center; align-items: center; }
    .card-modal.show { display: flex; }
    
    .card-modal-content { 
      background: #F1F5F9; width: 95vw; max-width: 1000px; max-height: 90vh; 
      border-radius: 12px; overflow-y: auto; position: relative; padding: 4rem; 
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease-out; 
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .card-modal-close { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 2.5rem; color: #64748B; cursor: pointer; line-height: 1; transition: 0.3s; z-index: 10; }
    .card-modal-close:hover { color: #0F172A; }
    
    .modal-header { margin-bottom: 2rem; border-bottom: 1px solid #CBD5E1; padding-bottom: 1.5rem; }
    .modal-header h2 { font-size: 2.5rem; font-weight: 800; color: #0F172A; margin-bottom: 0.5rem; }
    .modal-header p { font-size: 1.1rem; color: #475569; }
    
    /* 上方文字 */
    .modal-text-content { font-size: 1.05rem; color: #334155; margin-bottom: 3rem; line-height: 2; }
    .modal-text-content p { margin-bottom: 1.5rem; }

    /* 下方轮播图组件 */
    .modal-carousel { position: relative; width: 100%; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    .carousel-track { display: flex; transition: transform 0.4s ease; }
    .carousel-item { flex: 0 0 100%; position: relative; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .carousel-item img { width: 100%; max-height: 500px; object-fit: contain; display: block; }
    .carousel-caption { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(15,23,42,0.7); color: #fff; padding: 0.8rem 1.5rem; font-size: 0.95rem; text-align: center; }
    
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; z-index: 2; transition: 0.3s; }
    .carousel-btn:hover { background: var(--tech-green); color: #000; }
    .carousel-btn.prev { left: 15px; }
    .carousel-btn.next { right: 15px; }
    
    .carousel-dots { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.5rem; z-index: 2; }
    .carousel-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: 0.3s; }
    .carousel-dot.active { background: #fff; transform: scale(1.2); }

    @media (max-width: 992px) {
      .layout-intro, .two-col-lists { flex-direction: column; gap: 2rem; }
      .product-grid { grid-template-columns: 1fr; }
      .page-title { font-size: 2.5rem; }
      .card-modal-content { padding: 2rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">你的品牌名</div>
    <a href="index.html" class="back-btn">← 返回首页</a>
  </div>
</header>

<div id="page-content"><div class="loading">正在加载...</div></div>

<!-- 卡片详情弹窗 -->
<div id="card-modal" class="card-modal" onclick="closeCardModal(event)">
  <div class="card-modal-content" onclick="event.stopPropagation()">
    <span class="card-modal-close" onclick="closeCardModal()">&times;</span>
    <div class="modal-header">
      <h2 id="modal-card-title"></h2>
      <p id="modal-card-desc"></p>
    </div>
    
    <!-- 文字介绍区域 -->
    <div class="modal-text-content" id="modal-card-text"></div>

    <!-- 下方轮播图区域 -->
    <div class="modal-carousel" id="modal-carousel-wrapper" style="display: none;">
      <div class="carousel-track" id="carousel-track"></div>
      <button class="carousel-btn prev" id="carousel-prev" onclick="slideModalCarousel(-1)">‹</button>
      <button class="carousel-btn next" id="carousel-next" onclick="slideModalCarousel(1)">›</button>
      <div class="carousel-dots" id="carousel-dots"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  let pageData = null;

  async function loadPartnerDetail() {
    const params = new URLSearchParams(window.location.search);
    const fileId = params.get('id');
    const pageContent = document.getElementById('page-content');

    if (!fileId) return;

    try {
      const res = await fetch(`/data.json?t=${new Date().getTime()}`);
      const data = await res.json();
      pageData = data.partners ? data.partners.find(p => p.filename === fileId) : null;
      if (!pageData) throw new Error('未找到数据');

      // 渲染页面主体（这里省略部分逻辑，保留原有结构）
      // ... (省略部分与之前相同的渲染代码)
      
      // 为了演示，我们直接渲染出卡片列表
      const gridHtml = pageData.cards ? pageData.cards.map((p, index) => `
        <div class="grid-card">
          ${p.image ? `<img src="${p.image}">` : ''}
          <h4>${p.title || ''}</h4>
          <p>${p.desc || ''}</p>
          <span class="link" onclick="openCardModal(${index})">了解更多</span>
        </div>
      `).join('') : '';

      pageContent.innerHTML = `
        <div class="page-container">
          <h1 class="page-title">${pageData.title}</h1>
          <div class="grid-section">
            <h2>${pageData.grid_title || '可用产品'}</h2>
            <div class="product-grid">${gridHtml}</div>
          </div>
        </div>
      `;

    } catch (e) {
      console.error(e);
    }
  }

  let modalCurrentIndex = 0;
  let modalTotalImages = 0;

  // 打开弹窗
  function openCardModal(index) {
    if (!pageData || !pageData.cards || !pageData.cards[index]) return;
    const card = pageData.cards[index];
    
    document.getElementById('modal-card-title').innerText = card.title || '详情介绍';
    document.getElementById('modal-card-desc').innerText = card.desc || '';
    
    // 渲染纯文本（支持换行）
    const textContent = (card.modal_text || '暂无详细文字介绍。').replace(/\n/g, '<br>');
    document.getElementById('modal-card-text').innerHTML = textContent;

    // 渲染轮播图
    const carouselWrapper = document.getElementById('modal-carousel-wrapper');
    const track = document.getElementById('carousel-track');
    const dotsContainer = document.getElementById('carousel-dots');
    
    track.innerHTML = '';
    dotsContainer.innerHTML = '';
    
    if (card.modal_images && Array.isArray(card.modal_images) && card.modal_images.length > 0) {
      modalTotalImages = card.modal_images.length;
      modalCurrentIndex = 0;
      
      card.modal_images.forEach((imgObj, i) => {
        // 渲染图片
        const itemHtml = `
          <div class="carousel-item">
            <img src="${imgObj.img}" alt="图片${i+1}">
            ${imgObj.caption ? `<div class="carousel-caption">${imgObj.caption}</div>` : ''}
          </div>
        `;
        track.insertAdjacentHTML('beforeend', itemHtml);

        // 渲染指示点
        const dot = document.createElement('span');
        dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => goToModalSlide(i);
        dotsContainer.appendChild(dot);
      });

      carouselWrapper.style.display = 'block';
      // 如果只有一张图，隐藏左右箭头
      document.getElementById('carousel-prev').style.display = modalTotalImages > 1 ? 'flex' : 'none';
      document.getElementById('carousel-next').style.display = modalTotalImages > 1 ? 'flex' : 'none';
      
      // 初始化位置
      goToModalSlide(0);
    } else {
      carouselWrapper.style.display = 'none';
    }

    document.getElementById('card-modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  // 轮播图切换逻辑
  function goToModalSlide(index) {
    if (index < 0) index = modalTotalImages - 1;
    if (index >= modalTotalImages) index = 0;
    modalCurrentIndex = index;

    const track = document.getElementById('carousel-track');
    track.style.transform = `translateX(-${index * 100}%)`;

    const dots = document.querySelectorAll('.carousel-dot');
    dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
  }

  function slideModalCarousel(direction) {
    goToModalSlide(modalCurrentIndex + direction);
  }

  // 关闭弹窗
  function closeCardModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('card-modal').classList.remove('show');
    document.body.style.overflow = 'auto';
  }

  window.addEventListener('load', loadPartnerDetail);
</script>
</body>
</html>
