<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部门介绍 - 你的品牌名</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap');
    :root { --tech-green: #00FFB9; --dark-bg: #0F172A; --text-main: #111827; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; color: var(--text-main); line-height: 1.8; background: #fff; }
    a { text-decoration: none; transition: 0.3s; color: inherit; }

    /* --- 页面主体样式 --- */
    header { background: var(--dark-bg); position: sticky; top: 0; z-index: 1000; }
    .header-inner { max-width: 1240px; margin: 0 auto; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: 2px; }
    .back-btn { color: var(--tech-green); font-weight: 600; display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem; }

    .page-container { max-width: 1240px; margin: 0 auto; padding: 4rem 2rem; }
    .page-title { font-size: 3.5rem; font-weight: 800; margin-bottom: 3rem; color: var(--text-main); letter-spacing: -1px; line-height: 1.2; }

    .layout-intro { display: flex; gap: 5rem; align-items: flex-start; margin-bottom: 4rem; }
    .layout-intro .intro-text { flex: 1; font-size: 1.05rem; color: #374151; }
    .layout-intro .intro-text p { margin-bottom: 1.5rem; text-align: justify; line-height: 2; }
    .layout-intro .intro-logo { flex: 0.6; display: flex; justify-content: flex-end; }
    .layout-intro .intro-logo img { max-width: 100%; max-height: 180px; object-fit: contain; }

    .two-col-lists { display: flex; gap: 6rem; margin-bottom: 5rem; }
    .two-col-lists .list-group { flex: 1; }
    .two-col-lists h3 { font-size: 1.6rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-main); }
    .two-col-lists ul { list-style-type: disc; padding-left: 1.5rem; color: #111827; font-weight: 500; }
    .two-col-lists li { margin-bottom: 0.8rem; font-size: 1.05rem; }
    .two-col-lists p { color: #111827; font-size: 1.05rem; line-height: 2; }

    .grid-section h2 { font-size: 2.2rem; font-weight: 700; margin-bottom: 2.5rem; color: var(--text-main); }
    .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem 2rem; }
    .grid-card { display: flex; flex-direction: column; }
    .grid-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; margin-bottom: 1.5rem; border-radius: 4px; background: #f3f4f6; }
    .grid-card h4 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.8rem; color: var(--text-main); line-height: 1.4; }
    .grid-card p { font-size: 1rem; color: #374151; line-height: 1.7; margin-bottom: 1.5rem; flex-grow: 1; }
    .grid-card .link { color: #0ea5e9; font-weight: 700; font-size: 1rem; display: inline-block; cursor: pointer; }
    .grid-card .link:hover { text-decoration: underline; }

    /* --- 弹窗样式 --- */
    .card-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); z-index: 3000; justify-content: center; align-items: center; }
    .card-modal.show { display: flex; }
    
    .card-modal-content { 
      background: #F1F5F9; width: 95vw; max-width: 1000px; max-height: 90vh; 
      border-radius: 12px; overflow-y: auto; position: relative; padding: 4rem; 
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease-out; 
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .card-modal-close { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 2.5rem; color: #64748B; cursor: pointer; line-height: 1; transition: 0.3s; z-index: 10; }
    .card-modal-close:hover { color: #0F172A; }
    
    .modal-header { margin-bottom: 2rem; border-bottom: 1px solid #CBD5E1; padding-bottom: 1.5rem; }
    .modal-header h2 { font-size: 2.5rem; font-weight: 800; color: #0F172A; margin-bottom: 0.5rem; }
    .modal-header p { font-size: 1.1rem; color: #475569; }

     /* 优化：去掉内层白框，减小边距 */
    .modal-slider-container {
      position: relative;
      display: flex;
      flex-direction: column;
      /* 去掉了 background, border-radius, box-shadow */
    }

    .slide-text-wrapper {
      padding: 1rem 0 1.5rem 0; /* 减小左右内边距，去掉底部边框 */
      font-size: 1.15rem;
      color: #334155;
      line-height: 1.9;
      min-height: 100px; 
    }

    .slide-image-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      /* 去掉了背景色，让图片直接融入大背景 */
    }
    .slide-image-wrapper img {
      width: 100%;
      max-height: 550px; /* 图片高度稍微放大一点 */
      object-fit: contain;
      display: block;
      border-radius: 8px; /* 给图片自己加个圆角，更柔和 */
    }
    .slide-caption {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      background: rgba(15,23,42,0.7);
      color: #fff;
      padding: 0.6rem 1.5rem;
      font-size: 0.95rem;
      text-align: center;
    }

    /* 左右切换按钮 */
    .slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.6);
      color: #fff;
      border: none;
      width: 45px; height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
      transition: 0.3s;
    }
    .slide-btn:hover { background: var(--tech-green); color: #000; }
    .slide-btn.prev { left: 10px; }
    .slide-btn.next { right: -10px; }
    /* 移动端保持在内侧 */
    @media (max-width: 992px) {
      .slide-btn.prev { left: 10px; }
      .slide-btn.next { right: 10px; }
    }

    /* 底部指示点 */
    .slide-dots {
      position: absolute;
      bottom: 1rem; left: 50%; transform: translateX(-50%);
      display: flex; gap: 0.5rem; z-index: 10;
    }
    .slide-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.4); cursor: pointer; transition: 0.3s;
    }
    .slide-dot.active { background: #fff; transform: scale(1.2); }

    @media (max-width: 992px) {
      .layout-intro, .two-col-lists { flex-direction: column; gap: 2rem; }
      .product-grid { grid-template-columns: 1fr; }
      .page-title { font-size: 2.5rem; }
      .card-modal-content { padding: 2rem; }
      .modal-header h2 { font-size: 2rem; }
      .slide-text-wrapper { padding: 1.5rem; min-height: 120px; }
      .slide-btn { width: 35px; height: 35px; font-size: 1.2rem; }
    }
    
    .loading { text-align: center; color: #999; padding: 8rem 2rem; font-size: 1.2rem; }
    .error { text-align: center; color: #e74c39; padding: 8rem 2rem; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">你的品牌名</div>
    <a href="index.html" class="back-btn">← 返回首页</a>
  </div>
</header>

<div id="page-content"><div class="loading">正在加载...</div></div>

<!-- 卡片详情弹窗 -->
<div id="card-modal" class="card-modal" onclick="closeCardModal(event)">
  <div class="card-modal-content" onclick="event.stopPropagation()">
    <span class="card-modal-close" onclick="closeCardModal()">&times;</span>
    <div class="modal-header">
      <h2 id="modal-card-title"></h2>
      <p id="modal-card-desc"></p>
    </div>
    
    <!-- 图文幻灯片区域 -->
    <div class="modal-slider-container" id="modal-slider-wrapper" style="display: none;">
      
      <!-- 顶部文字区 -->
      <div class="slide-text-wrapper" id="slide-text"></div>
      
      <!-- 底部图片区 -->
      <div class="slide-image-wrapper">
        <img id="slide-image" src="" alt="">
        <div class="slide-caption" id="slide-caption" style="display: none;"></div>
      </div>
      
      <!-- 控制按钮 -->
      <button class="slide-btn prev" id="slide-prev" onclick="changeSlide(-1)">‹</button>
      <button class="slide-btn next" id="slide-next" onclick="changeSlide(1)">›</button>
      
      <!-- 指示点 -->
      <div class="slide-dots" id="slide-dots"></div>
    </div>
  </div>
</div>

<script>
  let pageData = null;
  let slidesData = [];
  let currentSlideIndex = 0;

  async function loadPartnerDetail() {
    const params = new URLSearchParams(window.location.search);
    const fileId = params.get('id');
    const pageContent = document.getElementById('page-content');

    if (!fileId) {
      pageContent.innerHTML = '<div class="error">未找到内容 ID。<br><a href="index.html">返回首页</a></div>';
      return;
    }

    try {
      const res = await fetch(`/data.json?t=${new Date().getTime()}`);
      if (!res.ok) throw new Error('数据加载失败');
      const data = await res.json();

      pageData = data.partners ? data.partners.find(p => p.filename === fileId) : null;
      if (!pageData) throw new Error('未找到该部门的数据');

      const title = pageData.title || '部门介绍';
      const introText = pageData.intro_text || '';
      const detailLogo = pageData.detail_logo || '';
      const industryList = pageData.industry_list || '';
      const collabTitle = pageData.collab_title || '合作模式';
      const collabText = pageData.collab_text || '';
      const gridTitle = pageData.grid_title || '可用产品';
      
      const listHtml = industryList.split('\n').filter(i => i.trim()).map(i => `<li>${i.trim()}</li>`).join('');

      let gridHtml = '';
      if (pageData.cards && Array.isArray(pageData.cards)) {
         pageData.cards.forEach((p, index) => {
           const imgHtml = p.image ? `<img src="${p.image}" alt="${p.title || ''}">` : '';
           gridHtml += `
            <div class="grid-card">
              ${imgHtml}
              <h4>${p.title || ''}</h4>
              <p>${p.desc || ''}</p>
              <span class="link" onclick="openCardModal(${index})">了解更多</span>
            </div>
           `;
         });
      }

      const introLayoutHtml = detailLogo 
        ? `<div class="intro-text"><p>${introText.replace(/\n/g, '</p><p>')}</p></div>
           <div class="intro-logo"><img src="${detailLogo}" alt="${title} Logo"></div>`
        : `<div class="intro-text" style="flex: 1; width: 100%;"><p>${introText.replace(/\n/g, '</p><p>')}</p></div>`;

      pageContent.innerHTML = `
        <div class="page-container">
          <h1 class="page-title">${title}</h1>
          <div class="layout-intro">${introLayoutHtml}</div>
          <div class="two-col-lists">
            <div class="list-group"><h3>产业</h3><ul>${listHtml}</ul></div>
            <div class="list-group"><h3>${collabTitle}</h3><p>${collabText.replace(/\n/g, '<br>')}</p></div>
          </div>
          ${gridHtml ? `
          <div class="grid-section">
            <h2>${gridTitle}</h2>
            <div class="product-grid">${gridHtml}</div>
          </div>
          ` : ''}
        </div>
      `;

    } catch (e) {
      console.error(e);
      pageContent.innerHTML = '<div class="error">加载失败。<br><a href="index.html">返回首页</a></div>';
    }
  }

  // 打开弹窗
  function openCardModal(index) {
    if (!pageData || !pageData.cards || !pageData.cards[index]) return;
    const card = pageData.cards[index];
    
    document.getElementById('modal-card-title').innerText = card.title || '详情介绍';
    document.getElementById('modal-card-desc').innerText = card.desc || '';

    // 初始化图文数据
    slidesData = card.modal_slides || [];
    
    const sliderWrapper = document.getElementById('modal-slider-wrapper');
    
    if (slidesData.length > 0) {
      sliderWrapper.style.display = 'block';
      currentSlideIndex = 0;
      renderSlide();
    } else {
      sliderWrapper.style.display = 'none';
    }

    document.getElementById('card-modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  // 渲染当前幻灯片的文字和图片
  function renderSlide() {
    if (slidesData.length === 0) return;
    const slide = slidesData[currentSlideIndex];

    // 1. 更新文字（支持换行）
    const textEl = document.getElementById('slide-text');
    textEl.innerHTML = (slide.text || '暂无文字介绍。').replace(/\n/g, '<br>');

    // 2. 更新图片
    const imgEl = document.getElementById('slide-image');
    imgEl.src = slide.img || '';

    // 3. 更新图片说明
    const captionEl = document.getElementById('slide-caption');
    if (slide.caption) {
      captionEl.innerText = slide.caption;
      captionEl.style.display = 'block';
    } else {
      captionEl.style.display = 'none';
    }

    // 4. 处理按钮和指示点
    const prevBtn = document.getElementById('slide-prev');
    const nextBtn = document.getElementById('slide-next');
    const dotsContainer = document.getElementById('slide-dots');
    
    if (slidesData.length > 1) {
      prevBtn.style.display = 'flex';
      nextBtn.style.display = 'flex';
      
      // 重新渲染指示点
      dotsContainer.innerHTML = '';
      slidesData.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'slide-dot' + (i === currentSlideIndex ? ' active' : '');
        dot.onclick = () => { currentSlideIndex = i; renderSlide(); };
        dotsContainer.appendChild(dot);
      });
    } else {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      dotsContainer.innerHTML = '';
    }
  }

  // 左右切换
  function changeSlide(direction) {
    if (slidesData.length <= 1) return;
    currentSlideIndex += direction;
    if (currentSlideIndex < 0) currentSlideIndex = slidesData.length - 1;
    if (currentSlideIndex >= slidesData.length) currentSlideIndex = 0;
    renderSlide();
  }

  function closeCardModal(event) {
    if (event && event.target !== event.currentTarget) return;
    document.getElementById('card-modal').classList.remove('show');
    document.body.style.overflow = 'auto';
  }

  window.addEventListener('load', loadPartnerDetail);
</script>
</body>
</html>
