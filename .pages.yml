media:
  - name: "uploads"
    label: "图片"
    input: "images/uploads"
    output: "/images/uploads"
    categories: [image]
    extensions: [jpg, jpeg, png, gif, webp, svg]
    rename: safe

content:
  - name: "news"
    label: "新闻动态"
    type: "collection"
    path: "content/news"
    create: true
    delete: true
    fields:
      - { name: "title", label: "标题", type: "string" }
      - { name: "date", label: "日期", type: "date" }
      - { name: "body", label: "正文", type: "rich-text", options: { media: { name: "uploads", input: "images/uploads", output: "/images/uploads", categories: [image], extensions: [jpg, jpeg, png, gif, webp, svg], rename: safe } } }
  - name: "products"
    label: "产品展示"
    type: "collection"
    path: "content/products"
    create: true
    delete: true
    fields:
      - { name: "category", label: "分类（大标题）", type: "string" }
      - { name: "title", label: "产品标题", type: "string" }
      - { name: "description", label: "简短介绍", type: "text" }
      - { name: "image", label: "顶部产品背景图片", type: "image" }
      - { name: "btn1_text", label: "按钮1文字", type: "string", default: "探索产品" }
      - { name: "btn2_text", label: "按钮2文字", type: "string", default: "联系我们" }
      - { name: "body", label: "产品正文", type: "rich-text" }
  - name: "social"
    label: "社交媒体"
    type: "file"
    path: "content/social.json"
    fields:
      - name: "posts"
        label: "帖子列表"
        type: "list"
        fields:
          - { name: "date", label: "日期", type: "string" }
          - { name: "platform", label: "平台", type: "select", options: ["Facebook", "Instagram", "LinkedIn", "TikTok", "YouTube"] }
          - { name: "content", label: "文案", type: "text" }
          - { name: "link", label: "帖子链接", type: "string" }
          - { name: "img", label: "图片链接", type: "string" }
