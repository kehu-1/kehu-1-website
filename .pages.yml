media: "图片"

content:
  # 1. 新闻动态
  - name: "news"
    label: "新闻动态"
    type: "collection"
    path: "content/news"
    create: true
    delete: true
    fields:
      - { name: "title", label: "标题", type: "string" }
      - { name: "date", label: "日期", type: "date" }
      - { name: "body", label: "正文", type: "rich-text" }

  # 2. 客户故事
  - name: "stories"
    label: "客户故事"
    type: "collection"
    path: "content/stories"
    create: true
    delete: true
    fields:
      - { name: "category", label: "分类（大标题）", type: "string" }
      - { name: "title", label: "故事标题", type: "string" }
      - { name: "date", label: "日期", type: "date" }
      - { name: "image", label: "顶部产品背景图片（Hero大图）", type: "image" }
      - { name: "card1_title", label: "产品名称", type: "string" }
      - { name: "card1_desc", label: "简短介绍", type: "text" }
      - { name: "card2_title", label: "案例主图（下方图）", type: "string" }
      - { name: "body", label: "案例正文", type: "rich-text" }

  # 3. 社交媒体
  - name: "social"
    label: "社交媒体"
    type: "file"
    path: "content/social.json"
    fields:
      - { name: "posts", label: "帖文列表", type: "object", list: true, fields: [
          { name: "platform", label: "平台", type: "string" },
          { name: "date", label: "日期", type: "date" },
          { name: "content", label: "内容", type: "text" },
          { name: "img", label: "图片", type: "image" },
          { name: "link", label: "链接", type: "string" }
        ] }

  # 4. 产品展示
  - name: "products"
    label: "产品展示"
    type: "collection"
    path: "content/products"
    create: true
    delete: true
    fields:
      # 基础信息
      - { name: "category", label: "分类（大标题）", type: "string" }
      - { name: "title", label: "产品标题", type: "string" }
      - { name: "description", label: "简短介绍", type: "text" }
      - { name: "image", label: "顶部产品背景图片", type: "image" }
      - { name: "btn1_text", label: "按钮1文字", type: "string", default: "用视频介绍产品" }
      - { name: "btn2_text", label: "按钮2文字", type: "string", default: "联系我们" }
      - { name: "video_url", label: "产品视频链接（YouTube）", type: "string" }
      
      # 产品优势区块（三视图）
      - { name: "advantage_title", label: "优势标题", type: "string", default: "面向未来的自动化系统" }
      - { name: "advantage_desc", label: "优势介绍（支持Markdown）", type: "text" }
      - { name: "advantage_img1", label: "上传图片1", type: "image" }
      - { name: "advantage_img1_desc", label: "图片1的描述（如：正面视图）", type: "string" }
      - { name: "advantage_img2", label: "上传图片2", type: "image" }
      - { name: "advantage_img2_desc", label: "图片2的描述（如：侧面接口细节）", type: "string" }
      - { name: "advantage_img3", label: "上传图片3", type: "image" }
      - { name: "advantage_img3_desc", label: "图片3的描述（如：背部散热设计）", type: "string" }

      # 白皮书区块
      - { name: "whitepaper_title", label: "白皮书标题", type: "string", default: "数字服务中心 (DSC)" }
      - { name: "whitepaper_desc", label: "白皮书介绍", type: "text" }
      - { name: "whitepaper_btn", label: "白皮书按钮文字", type: "string", default: "获取白皮书 ⬇️" }
      - { name: "whitepaper_link", label: "白皮书下载链接", type: "string", default: "#" }
      - { name: "whitepaper_cover", label: "产品介绍视频专属封面图（选填）", type: "image" }

      # 正文（最下方长文本）
      - { name: "body", label: "产品正文", type: "rich-text" }
